services:
  worker:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - video-data:/data
    cpus: 2
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
volumes:
  video-data:
